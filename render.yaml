services:
  - type: web
    name: monorepo-production-web
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node web/index.js
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: monorepo-production-db
          property: connectionString
  - type: worker
    name: monorepo-production-worker
    runtime: node
    region: oregon
    plan: 0.5c-512mb
    branch: main
    buildCommand: npm ci --omit=dev
    startCommand: node worker/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: monorepo-production-db
          property: connectionString
databases:
  - name: monorepo-production-db
    region: oregon
    plan: 0.1c-256mb
    diskSizeGB: 1
    postgresMajorVersion: "18"
    ipAllowList: []
